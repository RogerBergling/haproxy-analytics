# GoAccess parser for the standard HAProxy "option httplog" format.
#
# The application removes the syslog program prefix before passing HTTP lines
# to GoAccess. If your HAProxy configuration uses a custom log-format, mount
# your own GoAccess configuration and point GOACCESS_CONFIG at it.
time-format %H:%M:%S
date-format %d/%b/%Y
log-format %h:%^ [%d:%t.%^] %^ %^ %^ %s %b %^ %^ %^ %^ %^ "%r"
