# Central rsyslog receiver for HAProxy logs over TLS.
# This is a starting point, not a complete PKI or retention design.
# Replace the permitted peer, certificate paths and output path.
#
# The gtls driver also needs its CA, certificate and key configured, typically
# in /etc/rsyslog.conf or a separate global snippet. See your rsyslog TLS
# documentation for the exact directives for your version.
#
# The resulting file can be mounted read-only into the analytics container.

module(load="imtcp"
       StreamDriver.Name="gtls"
       StreamDriver.Mode="1"
       StreamDriver.AuthMode="x509/name"
       PermittedPeer=["haproxy.example.com"])

input(type="imtcp" port="6514" ruleset="haproxy")

template(name="HAProxyFile" type="string"
         string="%timereported:::date-rfc3339% %hostname% %syslogtag%%msg%\n")

ruleset(name="haproxy") {
    action(type="omfile" file="/var/log/haproxy/haproxy.log"
           template="HAProxyFile"
           dirCreateMode="0750" fileCreateMode="0640")
}
