# Forward HAProxy logs from the HAProxy host to a central rsyslog over TLS.
# This is a starting point. Use certificates from your own CA and verify the
# peer name. Replace central.example.com and the certificate paths.

action(
    type="omfwd"
    target="central.example.com"
    port="6514"
    protocol="tcp"
    template="RSYSLOG_SyslogProtocol23Format"
    tls="on"
    tls.caCert="/etc/rsyslog.d/ca.pem"
    tls.myCert="/etc/rsyslog.d/client.pem"
    tls.myPrivKey="/etc/rsyslog.d/client.key"
    tls.authMode="x509/name"
    tls.permittedPeer=["central.example.com"]
    action.resumeRetryCount="-1"
    queue.type="linkedList"
    queue.size="10000"
)
