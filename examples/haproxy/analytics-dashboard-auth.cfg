# HAProxy Analytics example: authenticated HTTPS frontend for the dashboard.
#
# The application has no built-in login. Terminate TLS here and require
# authentication before proxying to 127.0.0.1:8080.
#
# Generate a password hash, for example:
#   mkpasswd -m sha-512
# or:
#   openssl passwd -6
#
# Replace example.com, the certificate path, the username and the hash.
# Validate before reloading:
#   haproxy -c -f /etc/haproxy/haproxy.cfg
#   systemctl reload haproxy

userlist analytics_users
    user admin password $6$REPLACE_WITH_A_REAL_HASH

frontend fe_analytics
    bind *:8443 ssl crt /etc/haproxy/certs/analytics.example.com.pem alpn h2,http/1.1
    mode http
    option httplog

    http-request auth realm "HAProxy Analytics" unless { http_auth(analytics_users) }

    http-response set-header Strict-Transport-Security "max-age=31536000; includeSubDomains"
    http-response set-header X-Content-Type-Options "nosniff"

    default_backend bk_analytics

backend bk_analytics
    mode http
    option forwardfor
    server analytics 127.0.0.1:8080 check
