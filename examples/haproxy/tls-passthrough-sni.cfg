# HAProxy Analytics example: TLS passthrough with SNI capture.
#
# This frontend does not decrypt traffic. The app sees the client address, the
# destination and the ClientHello SNI only. It cannot see URLs or HTTP headers.
#
# The capture line MUST come before the accept line.
#
# Validate before reloading:
#   haproxy -c -f /etc/haproxy/haproxy.cfg
#   systemctl reload haproxy

frontend fe_tls_passthrough
    bind *:443
    mode tcp
    tcp-request inspect-delay 1s
    tcp-request content capture req.ssl_sni len 100
    tcp-request content accept if { req_ssl_hello_type 1 }

    log-format "src=%ci dst=%fi:%fp sni=%[capture.req.hdr(0)]"

    use_backend bk_app_tls if { req_ssl_sni -i app.example.com }
    use_backend bk_app_tls if { req_ssl_sni -i www.example.com }
    default_backend bk_reject

backend bk_app_tls
    mode tcp
    server app1 192.0.2.10:443 check

backend bk_reject
    mode tcp
    tcp-request content reject
