# HAProxy Analytics example: dedicated read-only live stats socket.
#
# This is a fragment for the global section. Keep the existing admin socket
# and add a separate socket for the analytics host. Do not replace the admin
# socket and do not bind this socket to 0.0.0.0.
#
# HAProxy's stats protocol has no TLS or authentication. Bind it to one private
# interface address and firewall the port to the analytics host only. If the
# path crosses an untrusted network, use an SSH tunnel or a read-only mTLS
# agent instead.
#
# Replace 192.0.2.20 and 8404 with values from your own network.
# Validate before reloading:
#   haproxy -c -f /etc/haproxy/haproxy.cfg
#   systemctl reload haproxy

global
    # Existing administration socket. Keep it as it is.
    stats socket /run/haproxy/admin.sock mode 660 level admin

    # Dedicated read-only socket for HAProxy Analytics.
    stats socket ipv4@192.0.2.20:8404 level user
    stats timeout 30s
