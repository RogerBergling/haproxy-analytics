# HAProxy Analytics example: HTTP mode with TLS termination.
#
# This is a fragment, not a complete production config. Keep your existing
# routing, certificates, ACLs, backends and timeouts. Replace example.com,
# 192.0.2.10 and the certificate paths with your own values.
#
# Validate before reloading:
#   haproxy -c -f /etc/haproxy/haproxy.cfg
#   systemctl reload haproxy

global
    log /dev/log local0
    log /dev/log local1 notice
    chroot /var/lib/haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin
    stats timeout 30s
    user haproxy
    group haproxy
    daemon

defaults
    log global
    mode http
    option httplog
    option dontlognull
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend fe_https
    bind *:443 ssl crt /etc/haproxy/certs/example.com.pem alpn h2,http/1.1
    mode http
    option httplog
    capture request header Host len 64
    default_backend bk_web

backend bk_web
    mode http
    option httpchk GET /
    server web1 192.0.2.10:8080 check
